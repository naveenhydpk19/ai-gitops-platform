services:
  api:
    build: ./backend
    environment:
      CHANGEGUARD_DATABASE: /app/data/changeguard.db
      SERVICE_CATALOG_PATH: /app/config/service-catalog.json
      SERVICE_CATALOG_SOURCE: ${SERVICE_CATALOG_SOURCE:-backend/config/service-catalog.json}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      KUBERNETES_API_URL: ${KUBERNETES_API_URL:-}
      KUBERNETES_TOKEN: ${KUBERNETES_TOKEN:-}
    volumes:
      - ./backend/data:/app/data
      - ./backend/config:/app/config:ro
    ports:
      - "8000:8000"
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    depends_on:
      - api