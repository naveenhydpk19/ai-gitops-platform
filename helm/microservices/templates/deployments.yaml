{{- range .Values.services }}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  strategy:
    canary:
      maxSurge: {{ $.Values.rollout.canaryReplicas }}
      maxUnavailable: 0
      steps:
        - setWeight: {{ $.Values.rollout.initialWeight }}
        - pause:
            duration: {{ $.Values.rollout.initialPause }}
        - analysis:
            templates:
              - templateName: pod-readiness
            args:
              - name: service-name
                value: {{ .name | quote }}
              - name: namespace
                value: {{ $.Release.Namespace | quote }}
        - setWeight: {{ $.Values.rollout.promotionWeight }}
        - pause:
            duration: {{ $.Values.rollout.promotionPause }}
        - analysis:
            templates:
              - templateName: pod-readiness
            args:
              - name: service-name
                value: {{ .name | quote }}
              - name: namespace
                value: {{ $.Release.Namespace | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["{{ .artifact }}"]
          ports:
            - name: http
              containerPort: {{ .port }}
          env:
            - name: JAVA_HEAP_MEMORY
              value: {{ $.Values.javaHeap | quote }}
            - name: eureka.instance.hostname
              value: {{ .name | quote }}
          envFrom:
            - configMapRef:
                name: service-config
          resources:
{{ toYaml $.Values.resources | indent 12 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
{{- end }}