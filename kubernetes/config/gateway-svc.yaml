---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  labels:
    app: gateway-svc
spec:
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 32100
  selector:
    app: gateway-svc
#  type: ClusterIP
  type: LoadBalancer
#  type: NodePort

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-svc-pods
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
       maxUnavailable: 25%
       maxSurge: 1
  template:
    metadata:
      labels:
        app: gateway-svc
    spec:
      containers:
      - name: gateway-svc-cont
        image: IMAGE_REGISTRY_PATH/micro-service:REVISION_ID
        args: ["gateway"]
        imagePullPolicy: IMAGE_PULL_POLICY
        ports:
          - containerPort: 8080
        volumeMounts:
          - name: log-data
            mountPath: /var/log/oms
        env:
          - name: eureka.instance.hostname
            value: gateway-svc
          - name: spring.config.name
            value: application-kube
        envFrom:
          - configMapRef:
              name: service-config
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 180
        readinessProbe:
          httpGet:
            path: /actuator/gateway/routes
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 2
      volumes:
        - name: log-data
          emptyDir: {}
      topologySpreadConstraints:                                                                                                                     
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: gateway-svc
