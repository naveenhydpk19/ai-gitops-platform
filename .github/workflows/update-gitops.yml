name: ChangeGuard GitOps promotion

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      values_environment:
        required: false
        type: string
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update desired image tag
        env:
          TARGET: ${{ inputs.values_environment || inputs.environment }}
        shell: bash
        run: |
          file="gitops/environments/$TARGET/values.yaml"
          sed -i -E 's/^  tag: ".*"/  tag: "${{ inputs.version }}"/' "$file"
          git config user.name "changeguard-release-bot"
          git config user.email "changeguard-release-bot@users.noreply.github.com"
          git add "$file"
          git diff --cached --quiet && exit 0
          git commit -m "deploy($TARGET): promote v${{ inputs.version }}"
          git push
      - name: Wait for Argo CD synchronization and health
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          TARGET: ${{ inputs.values_environment || inputs.environment }}
        shell: bash
        run: |
          test -n "$ARGOCD_SERVER"
          test -n "$ARGOCD_AUTH_TOKEN"
          curl --fail --location --output /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/download/v2.13.3/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
          argocd app sync "training-microservices-$TARGET" --grpc-web
          argocd app wait "training-microservices-$TARGET" --sync --health --timeout 600 --grpc-web